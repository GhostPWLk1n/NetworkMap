# Запуск выделенного сервера базы NetworkMap.
#
#   1) придумайте ключ доступа:  openssl rand -hex 24
#   2) положите его в файл .env рядом с этим файлом:  NM_TOKEN=<ключ>
#   3) docker compose up -d
#   4) в приложении: ⚙️ Настройки БД → Подключиться к серверу → адрес, порт и тот же ключ
#
# Статус в браузере: http://<адрес сервера>:47821/?token=<ключ>

services:
  networkmap-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: networkmap-server:latest
    container_name: networkmap-server
    restart: unless-stopped

    ports:
      # Слева — порт на машине с докером, справа — внутри контейнера.
      # Чтобы сервер был доступен только с самой машины, напишите "127.0.0.1:47821:47821"
      - "47821:47821"

    environment:
      # Ключ доступа. Берётся из файла .env рядом с docker-compose.yml.
      # Без него сервер не запустится — это осознанно: он слушает круглосуточно.
      # Если сеть заведомо закрыта и ключ не нужен, уберите эту строку и добавьте
      # NM_ALLOW_ANONYMOUS=1 (тогда подключится любой, кто видит порт).
      NM_TOKEN: ${NM_TOKEN:?укажите NM_TOKEN в файле .env рядом с docker-compose.yml}

      # Запись разрешена всем подключённым; конфликты разводятся блокировками на объект
      # (кто первый открыл — тот и правит, у остальных объект подсвечен как занятый).
      # NM_ALLOW_WRITES: "0" — сделать сервер доступным только для чтения.
      NM_ALLOW_WRITES: "1"

      # Резервные копии складываются в /data/backups тем же онлайн-бэкапом SQLite,
      # что безопасен при работающей базе (простое копирование файла при включённом
      # WAL даёт рваную копию).
      NM_BACKUP: "1"
      NM_BACKUP_EVERY_HOURS: "24"
      NM_BACKUP_KEEP: "14"

      TZ: Europe/Moscow

    volumes:
      # Папка data рядом с этим файлом: сама база, журнал WAL, файл-замок и копии.
      # Это единственное, что нужно забирать при переносе сервера на другую машину.
      # Сюда же кладётся bitrix.yml для синхронизации с Битрикс24 (см. bitrix.example.yml).
      - ./data:/data
