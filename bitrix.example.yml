# Образец настройки синхронизации с Битрикс24 (задача #3).
#
# Скопируйте этот файл под именем bitrix.yml и положите его на стороне, которая
# хранит базу, — по умолчанию рядом с файлом базы:
#   - обычный режим и режим «хост» — рядом с data.db (путь виден в окне «🗄 БД»);
#   - выделенный сервер — в его папку данных: ./data/bitrix.yml рядом с docker-compose.yml;
#   - запуск из исходников (npm start) — можно в корень репозитория.
# Клиентам сервера и хоста файл НЕ нужен: запросы в Битрикс24 делает сервер.
#
# bitrix.yml содержит ключ доступа — в Git он не попадает (см. .gitignore), в журналы
# и сообщения об ошибках приложение его не выводит. Не пересылайте файл в чатах.

# Адрес входящего вебхука из Битрикс24: «Разработчикам» → «Другое» → «Входящий вебхук».
# Права вебхука: только «Пользователи (базовое)» — user_basic. Приложение лишь читает
# профиль сотрудника методом user.get и ничего в Битрикс24 не меняет.
webhook_url: https://example.bitrix24.ru/rest/1/xxxxxxxxxxxxxxxx/

# Необязательно: сколько ждать ответа портала, в миллисекундах (1000–9000, по умолчанию
# 7000). Больше 9 секунд нельзя: клиент сервера ждёт ответа не дольше 10.
# timeout_ms: 7000
